services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-paltacheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paltacheck123}
      POSTGRES_DB:       ${DB_NAME:-paltacheck_db}
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-paltacheck} -d ${DB_NAME:-paltacheck_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://paltacheck:paltacheck123@timescaledb:5432/paltacheck_db}
      CAPTURAS_DIR: /app/capturas
      # Cadena de inferencia: gate Keras (palta/no_palta) + enfermedad ONNX (3 clases)
      DISEASE_ENABLED:     ${DISEASE_ENABLED:-true}
      BINARY_MODEL_PATH:   /app/models/best_model.keras
      DISEASE_MODEL_PATH:  /app/models/modelo_antracnosis.onnx
      DISEASE_CLASSES_PATH: /app/models/modelo_antracnosis_classes.json
    volumes:
      # Las fotos JPG persisten fuera del contenedor
      - ./backend/capturas:/app/capturas
      # Modelos de IA (.keras del gate + .onnx de enfermedad) montados solo-lectura
      - ./models:/app/models:ro
    depends_on:
      timescaledb:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@paltacheck.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}

volumes:
  timescale_data:
