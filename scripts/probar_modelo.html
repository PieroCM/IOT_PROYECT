<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PaltaCheck · Probar modelo (Palta / No-palta)</title>
<style>
  :root { --ok:#2f7d32; --ok-bg:#e7f4e7; --rej:#d11a1a; --rej-bg:#fbe3e3; --bd:#e3e6ea; --ink:#1a1a2e; --muted:#6c757d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Inter',system-ui,sans-serif; background:#eceef1; color:var(--ink); }
  .wrap { max-width:520px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.35rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin:0 0 18px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:14px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  label.small { font-size:.8rem; color:var(--muted); }
  input[type=text] { flex:1; padding:9px 12px; border:1px solid var(--bd); border-radius:8px; font:inherit; }
  .drop { border:2px dashed var(--bd); border-radius:12px; padding:26px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; }
  .drop.hover { border-color:var(--ok); background:var(--ok-bg); }
  .drop b { color:var(--ink); }
  #preview { display:none; width:100%; max-height:300px; object-fit:contain; background:#20242a; border-radius:10px; margin-top:14px; }
  button { margin-top:14px; width:100%; min-height:48px; border:none; border-radius:10px; background:var(--ok); color:#fff; font-size:1.05rem; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .result { margin-top:16px; border-radius:12px; padding:20px; text-align:center; display:none; }
  .result.ok  { background:var(--ok-bg);  border:2px solid rgba(47,125,50,.3); }
  .result.rej { background:var(--rej-bg); border:2px solid rgba(209,26,26,.3); }
  .result .verdict { font-size:2rem; font-weight:800; }
  .result.ok  .verdict { color:var(--ok); }
  .result.rej .verdict { color:var(--rej); }
  .result .conf { font-size:1rem; margin-top:4px; }
  .probs { margin-top:12px; font-size:.85rem; color:var(--muted); text-align:left; }
  .probline { display:flex; justify-content:space-between; padding:2px 0; font-variant-numeric:tabular-nums; }
  .err { color:var(--rej); font-size:.9rem; margin-top:12px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🥑 Probar modelo · Palta / No-palta</h1>
  <p class="sub">Sube una imagen y el modelo binario dice si <b>es palta</b> o <b>no</b>. No usa lote ni BD.</p>

  <div class="card">
    <div class="row">
      <label class="small">Backend:</label>
      <input id="backend" type="text" value="http://localhost:8000" />
    </div>

    <div id="drop" class="drop">
      <p>📷 Arrastra una imagen aquí<br>o <b>haz clic para elegir</b></p>
    </div>
    <input id="file" type="file" accept="image/*" hidden />
    <img id="preview" alt="preview" />

    <button id="btn" disabled>Clasificar</button>

    <div id="result" class="result">
      <div class="verdict" id="verdict"></div>
      <div class="conf" id="conf"></div>
      <div class="probs" id="probs"></div>
    </div>
    <div id="err" class="err"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let archivo = null;

  $('drop').onclick = () => $('file').click();
  $('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('hover'); };
  $('drop').ondragleave = () => $('drop').classList.remove('hover');
  $('drop').ondrop = (e) => { e.preventDefault(); $('drop').classList.remove('hover'); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); };
  $('file').onchange = (e) => { if (e.target.files[0]) setFile(e.target.files[0]); };

  function setFile(f) {
    archivo = f;
    const img = $('preview');
    img.src = URL.createObjectURL(f);
    img.style.display = 'block';
    $('btn').disabled = false;
    $('result').style.display = 'none';
    $('err').textContent = '';
  }

  $('btn').onclick = async () => {
    if (!archivo) return;
    $('btn').disabled = true; $('btn').textContent = 'Clasificando…';
    $('err').textContent = ''; $('result').style.display = 'none';
    try {
      const base = $('backend').value.replace(/\/$/, '');
      // Envía el archivo CRUDO en el cuerpo (el backend lee request.body()).
      const r = await fetch(base + '/api/modelo/probar', {
        method: 'POST',
        headers: { 'Content-Type': archivo.type || 'image/jpeg' },
        body: archivo,
      });
      if (!r.ok) { throw new Error('HTTP ' + r.status + ' — ' + (await r.text())); }
      const d = await r.json();
      const esPalta = d.es_palta;
      const res = $('result');
      res.className = 'result ' + (esPalta ? 'ok' : 'rej');
      res.style.display = 'block';
      $('verdict').textContent = (esPalta ? '✓ ' : '✕ ') + d.veredicto;
      $('conf').textContent = 'Confianza: ' + (d.confianza != null ? Math.round(d.confianza * 100) + '%' : '—');
      $('probs').innerHTML = Object.entries(d.probabilidades || {})
        .map(([k, v]) => `<div class="probline"><span>${k}</span><span>${Math.round(v * 100)}%</span></div>`).join('');
    } catch (e) {
      $('err').textContent = 'Error: ' + e.message;
    } finally {
      $('btn').disabled = false; $('btn').textContent = 'Clasificar';
    }
  };
</script>
</body>
</html>
